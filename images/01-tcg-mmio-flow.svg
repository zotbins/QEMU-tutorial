<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="820" height="330" fill="#ffffff" rx="10"/>
<text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">How a guest instruction reaches your device model</text>
<rect x="30" y="70" width="170" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="115.0" y="101.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Guest code</text>
<text x="115.0" y="116.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">str r0, [0x60001008]</text>
<rect x="300" y="70" width="200" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="400.0" y="101.05" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">TCG</text>
<text x="400.0" y="118.05" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">translates guest to host code</text>
<rect x="580" y="70" width="210" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="685.0" y="101.05" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Memory API</text>
<text x="685.0" y="118.05" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">finds the region at the address</text>
<line x1="200" y1="105" x2="300" y2="105" stroke="#374151" stroke-width="1.8"/>
<polygon points="300.0,105.0 290.0,110.0 290.0,100.0" fill="#374151"/>
<text x="250.0" y="99.0" text-anchor="middle" font-size="11" fill="#374151">runs</text>
<line x1="500" y1="105" x2="580" y2="105" stroke="#374151" stroke-width="1.8"/>
<polygon points="580.0,105.0 570.0,110.0 570.0,100.0" fill="#374151"/>
<text x="540.0" y="99.0" text-anchor="middle" font-size="11" fill="#374151">store hits MMIO</text>
<rect x="580" y="200" width="210" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="685.0" y="228.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Your device</text>
<text x="685.0" y="244.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">mydev_mmio_write(opaque,</text>
<text x="685.0" y="260.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">offset, value, size)</text>
<line x1="685" y1="140" x2="685" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="685.0,200.0 680.0,190.0 690.0,190.0" fill="#374151"/>
<text x="770" y="175" text-anchor="middle" font-size="11" fill="#374151">calls your callback</text>
<rect x="300" y="200" width="200" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="400.0" y="236.05" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Instance struct</text>
<text x="400.0" y="253.05" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">registers, state, irq lines</text>
<line x1="580" y1="240" x2="500" y2="240" stroke="#374151" stroke-width="1.8"/>
<polygon points="500.0,240.0 510.0,235.0 510.0,245.0" fill="#374151"/>
<text x="540.0" y="234.0" text-anchor="middle" font-size="11" fill="#374151">updates</text>
<text x="130" y="250" text-anchor="middle" font-size="12" fill="#374151">Plain RAM is accessed directly;</text>
<text x="130" y="268" text-anchor="middle" font-size="12" fill="#374151">only peripheral addresses call C code.</text>
</svg>