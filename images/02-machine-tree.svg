<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="820" height="420" fill="#ffffff" rx="10"/>
<text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">The QEMU machine tree</text>
<rect x="300" y="55" width="220" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="410.0" y="78.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Machine</text>
<text x="410.0" y="95.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">-M myboard (init function)</text>
<rect x="300" y="150" width="220" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="410.0" y="173.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">SoC</text>
<text x="410.0" y="189.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">owns CPU, memory map, peripherals</text>
<line x1="410" y1="110" x2="410" y2="150" stroke="#374151" stroke-width="1.8"/>
<polygon points="410.0,150.0 405.0,140.0 415.0,140.0" fill="#374151"/>
<text x="450" y="124.0" text-anchor="middle" font-size="11" fill="#374151">creates</text>
<rect x="40" y="250" width="180" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="130.0" y="273.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">CPU</text>
<text x="130.0" y="290.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">TCG-emulated</text>
<rect x="250" y="250" width="180" height="55" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="340.0" y="273.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">MemoryRegions</text>
<text x="340.0" y="290.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">RAM, ROM, MMIO</text>
<rect x="460" y="250" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="535.0" y="273.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">I2C controller</text>
<text x="535.0" y="290.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">(SysBusDevice)</text>
<rect x="640" y="250" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="715.0" y="273.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">GPIO controller</text>
<text x="715.0" y="290.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">(SysBusDevice)</text>
<line x1="410" y1="205" x2="130" y2="250" stroke="#374151" stroke-width="1.8"/>
<polygon points="130.0,250.0 139.1,243.5 140.7,253.3" fill="#374151"/>
<line x1="410" y1="205" x2="340" y2="250" stroke="#374151" stroke-width="1.8"/>
<polygon points="340.0,250.0 345.7,240.4 351.1,248.8" fill="#374151"/>
<line x1="410" y1="205" x2="535" y2="250" stroke="#374151" stroke-width="1.8"/>
<polygon points="535.0,250.0 523.9,251.3 527.3,241.9" fill="#374151"/>
<line x1="410" y1="205" x2="715" y2="250" stroke="#374151" stroke-width="1.8"/>
<polygon points="715.0,250.0 704.4,253.5 705.8,243.6" fill="#374151"/>
<rect x="440" y="350" width="190" height="55" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="535.0" y="373.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">I2C bus</text>
<text x="535.0" y="390.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">controller to devices</text>
<line x1="535" y1="305" x2="535" y2="350" stroke="#374151" stroke-width="1.8"/>
<polygon points="535.0,350.0 530.0,340.0 540.0,340.0" fill="#374151"/>
<rect x="670" y="350" width="130" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="735.0" y="373.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Your device</text>
<text x="735.0" y="390.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">I2C slave</text>
<line x1="630" y1="377" x2="670" y2="377" stroke="#374151" stroke-width="1.8"/>
<polygon points="670.0,377.0 660.0,382.0 660.0,372.0" fill="#374151"/>
<polygon points="630.0,377.0 640.0,372.0 640.0,382.0" fill="#374151"/>
<text x="150" y="345" text-anchor="middle" font-size="12" fill="#374151">The board wires everything together:</text>
<text x="150" y="363" text-anchor="middle" font-size="12" fill="#374151">devices, buses, and IRQ lines.</text>
</svg>