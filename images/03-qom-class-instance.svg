<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="820" height="380" fill="#ffffff" rx="10"/>
<text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">QOM: one class struct per type, one instance struct per object</text>
<rect x="40" y="60" width="330" height="120" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="205.0" y="100.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Class struct (one per TYPE)</text>
<text x="205.0" y="116.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">function pointers: event/send/recv</text>
<text x="205.0" y="132.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">shared data</text>
<text x="205.0" y="148.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">set in class_init (runs once)</text>
<rect x="450" y="60" width="330" height="120" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="615.0" y="100.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Instance struct (one per OBJECT)</text>
<text x="615.0" y="116.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">registers[], pointers, flags</text>
<text x="615.0" y="132.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">irq lines, timers</text>
<text x="615.0" y="148.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">instance_init runs per object</text>
<line x1="205" y1="180" x2="205" y2="230" stroke="#374151" stroke-width="1.8"/>
<polygon points="205.0,230.0 200.0,220.0 210.0,220.0" fill="#374151"/>
<text x="290" y="212" text-anchor="middle" font-size="11" fill="#374151">type_register_static()</text>
<rect x="100" y="230" width="210" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="205.0" y="259.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">TypeInfo: name, parent, sizes</text>
<line x1="310" y1="255" x2="450" y2="255" stroke="#374151" stroke-width="1.8"/>
<polygon points="450.0,255.0 440.0,260.0 440.0,250.0" fill="#374151"/>
<text x="380" y="245" text-anchor="middle" font-size="11" fill="#374151">qdev_new("mydev")</text>
<rect x="450" y="215" width="330" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="615.0" y="251.2" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Inheritance by embedding</text>
<text x="615.0" y="267.2" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">struct MyDev { I2CSlave parent_obj; ... }</text>
<text x="410" y="335" text-anchor="middle" font-size="12" fill="#374151">Parent first in the struct is what makes casts like MYDEV(obj) safe.</text>
<text x="410" y="355" text-anchor="middle" font-size="12" fill="#374151">Each object also has a runtime type tag, so wrong casts are caught.</text>
</svg>