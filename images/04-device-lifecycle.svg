<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="820" height="250" fill="#ffffff" rx="10"/>
<text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Device lifecycle</text>
<rect x="30" y="80" width="160" height="90" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="110.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">1. Create</text>
<text x="110.0" y="129.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">instance_init</text>
<text x="110.0" y="146.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">object allocated</text>
<line x1="190" y1="125" x2="225" y2="125" stroke="#374151" stroke-width="1.8"/>
<polygon points="225.0,125.0 215.0,130.0 215.0,120.0" fill="#374151"/>
<rect x="225" y="80" width="160" height="90" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="305.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">2. Set properties</text>
<text x="305.0" y="129.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">board sets address,</text>
<text x="305.0" y="146.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">config, links</text>
<line x1="385" y1="125" x2="420" y2="125" stroke="#374151" stroke-width="1.8"/>
<polygon points="420.0,125.0 410.0,130.0 410.0,120.0" fill="#374151"/>
<rect x="420" y="80" width="160" height="90" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="500.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">3. Realize</text>
<text x="500.0" y="129.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">realize() runs</text>
<text x="500.0" y="146.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">device is live</text>
<line x1="580" y1="125" x2="615" y2="125" stroke="#374151" stroke-width="1.8"/>
<polygon points="615.0,125.0 605.0,130.0 605.0,120.0" fill="#374151"/>
<rect x="615" y="80" width="160" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="695.0" y="112.55" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">4. Reset</text>
<text x="695.0" y="129.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">registers to</text>
<text x="695.0" y="146.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827">power-on values</text>
<line x1="710" y1="170" x2="710" y2="205" stroke="#374151" stroke-width="1.8" stroke-dasharray="5,4"/>
<polygon points="710.0,205.0 705.0,195.0 715.0,195.0" fill="#374151"/>
<line x1="710" y1="205" x2="110" y2="205" stroke="#374151" stroke-width="1.8" stroke-dasharray="5,4"/>
<polygon points="110.0,205.0 120.0,200.0 120.0,210.0" fill="#374151"/>
<line x1="110" y1="205" x2="110" y2="172" stroke="#374151" stroke-width="1.8" stroke-dasharray="5,4"/>
<polygon points="110.0,172.0 115.0,182.0 105.0,182.0" fill="#374151"/>
<text x="410" y="228" text-anchor="middle" font-size="12" fill="#374151">reset runs at boot and again on every system reset</text>
</svg>