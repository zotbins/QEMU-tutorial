<text x="460.0" y="303.85" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">.read  .write</text>
<text x="460.0" y="318.85" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">.valid access sizes</text>
