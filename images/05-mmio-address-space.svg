<rect x="360" y="120" width="200" height="100" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="460.0" y="158.85" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">MemoryRegion</text>
<text x="460.0" y="173.85" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">memory_region_init_io()</text>
<text x="460.0" y="188.85" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">size 0x1000, ops, opaque</text>
