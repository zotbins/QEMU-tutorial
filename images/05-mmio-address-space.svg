<rect x="50" y="226" width="180" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="140.0" y="244.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Your device (MMIO)</text>
<text x="140.0" y="259.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">0x6000_1000</text>
<rect x="50" y="278" width="180" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
