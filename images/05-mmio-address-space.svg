<text x="140.0" y="311.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">0x6000_2000</text>
<rect x="50" y="330" width="180" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="140.0" y="348.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">unimplemented_device</text>
<text x="140.0" y="363.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">0x7000_0000</text>
