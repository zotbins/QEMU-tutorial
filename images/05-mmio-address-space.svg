<text x="140.0" y="229.55" text-anchor="middle" font-size="13" font-weight="400" fill="#111827"></text>
<rect x="50" y="70" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="88.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ROM / flash</text>
<text x="140.0" y="103.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">0x0000_0000</text>
<rect x="50" y="122" width="180" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="140.0" y="140.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">RAM</text>
<text x="140.0" y="155.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">0x2000_0000</text>
<rect x="50" y="174" width="180" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="140.0" y="192.35" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">Device A (MMIO)</text>
