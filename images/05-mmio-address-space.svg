<text x="715.0" y="231.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">write(opaque, offset,</text>
<text x="715.0" y="246.35" text-anchor="middle" font-size="11" font-weight="400" fill="#111827" font-family="Consolas,monospace">      val, size)</text>
<line x1="240" y1="196" x2="360" y2="170" stroke="#374151" stroke-width="1.8"/>
<polygon points="360.0,170.0 351.3,177.0 349.2,167.2" fill="#374151"/>
<text x="300" y="165" text-anchor="middle" font-size="11" fill="#374151">sysbus_mmio_map()</text>
<line x1="460" y1="220" x2="460" y2="260" stroke="#374151" stroke-width="1.8"/>
<polygon points="460.0,260.0 455.0,250.0 465.0,250.0" fill="#374151"/>
<line x1="560" y1="300" x2="705" y2="270" stroke="#374151" stroke-width="1.8"/>
<polygon points="705.0,270.0 696.2,276.9 694.2,267.1" fill="#374151"/>
<text x="715" y="300" text-anchor="middle" font-size="11" fill="#374151">offset is relative to the region base,</text>
<text x="715" y="316" text-anchor="middle" font-size="11" fill="#374151">NOT the absolute address</text>
</svg>