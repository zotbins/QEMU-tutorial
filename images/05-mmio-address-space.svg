<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="820" height="430" fill="#ffffff" rx="10"/>
<text x="410.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">MMIO: registers appear in the physical address space</text>
