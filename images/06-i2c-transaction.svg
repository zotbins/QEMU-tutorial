<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
<rect width="860" height="330" fill="#ffffff" rx="10"/>
<text x="430.0" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">I2C: wire-level transaction vs. QEMU callbacks (register read)</text>
<text x="40" y="75" text-anchor="start" font-size="13" fill="#374151" font-weight="700">On the wire</text>
<text x="40" y="185" text-anchor="start" font-size="13" fill="#374151" font-weight="700">Your device sees</text>
<rect x="40" y="90" width="140" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="110.0" y="113.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">START</text>
<text x="110.0" y="129.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">addr+W</text>
<rect x="40" y="200" width="140" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="110.0" y="223.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">event</text>
<text x="110.0" y="239.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">START_SEND</text>
<line x1="110" y1="145" x2="110" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="110.0,200.0 105.0,190.0 115.0,190.0" fill="#374151"/>
<rect x="205" y="90" width="140" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="275.0" y="113.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">reg</text>
<text x="275.0" y="129.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">address</text>
<rect x="205" y="200" width="140" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="275.0" y="231.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">send(reg)</text>
<line x1="275" y1="145" x2="275" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="275.0,200.0 270.0,190.0 280.0,190.0" fill="#374151"/>
<rect x="370" y="90" width="140" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="440.0" y="113.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">RESTART</text>
<text x="440.0" y="129.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">addr+R</text>
<rect x="370" y="200" width="140" height="55" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="440.0" y="223.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">event</text>
<text x="440.0" y="239.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">START_RECV</text>
<line x1="440" y1="145" x2="440" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="440.0,200.0 435.0,190.0 445.0,190.0" fill="#374151"/>
<rect x="535" y="90" width="140" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="605.0" y="113.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">data</text>
<text x="605.0" y="129.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">byte</text>
<rect x="535" y="200" width="140" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="605.0" y="231.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">recv()</text>
<line x1="605" y1="145" x2="605" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="605.0,200.0 600.0,190.0 610.0,190.0" fill="#374151"/>
<rect x="700" y="90" width="140" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="770.0" y="121.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827">STOP</text>
<rect x="700" y="200" width="140" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="770.0" y="223.7" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">event</text>
<text x="770.0" y="239.7" text-anchor="middle" font-size="12" font-weight="400" fill="#111827" font-family="Consolas,monospace">FINISH</text>
<line x1="770" y1="145" x2="770" y2="200" stroke="#374151" stroke-width="1.8"/>
<polygon points="770.0,200.0 765.0,190.0 775.0,190.0" fill="#374151"/>
<text x="430" y="292" text-anchor="middle" font-size="12" fill="#374151">Bus layer: first byte after START_SEND is the register pointer; later bytes are data.</text>
<text x="430" y="312" text-anchor="middle" font-size="12" fill="#374151">All callbacks run synchronously and must return immediately.</text>
</svg>