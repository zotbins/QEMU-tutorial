<text x="420" y="285" text-anchor="middle" font-size="12" fill="#374151">Deterministic: you control the virtual clock and every register access.</text>
<text x="420" y="305" text-anchor="middle" font-size="12" fill="#374151">Great for reset values, register side effects, IRQ behavior, and timer expiry.</text>
